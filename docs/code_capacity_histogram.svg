<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Free choice of outfit fits 19-28% fewer players than the code does">

  <style>
    .surface { fill: #fcfcfb; }
    .ink-primary { fill: #0b0b0b; }
    .ink-secondary { fill: #52514e; }
    .axis { stroke: #d7d6d1; }
    .grid { stroke: #ebeae6; }
    .s-constrained { fill: #2a78d6; }
    .s-unconstrained { fill: #eb6834; }
    .k-constrained { stroke: #2a78d6; }
    .k-unconstrained { stroke: #eb6834; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink-primary { fill: #ffffff; }
      .ink-secondary { fill: #c3c2b7; }
      .axis { stroke: #4a4945; }
