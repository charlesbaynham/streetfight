name: Deploy to archive

# The public archive of the 19 September 2026 game, at
# streetfight.houseabsolute.co.uk — CT 124 (the Street Fight archive) on the
# home lab. This branch used to move a DigitalOcean droplet, which was
# destroyed once the game was over; the name and the branch both kept their
# meaning, and only the machine behind them changed.
#
# So this is deploy-staging.yml one branch along: `live` rather than
# `staging`, and the hypervisor's cattle-deploy.timer picks up the template
# release the build publishes. This workflow has no route to the host; it
# advances `refs/heads/live` and dispatches the build.
#
# `workflow_dispatch` is GitHub's manual job: a "Run workflow" button in the
# Actions tab, or `gh workflow run deploy.yml -f ref=<branch-or-sha>`. Merging
# to master deploys nothing.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to put live
        required: true
        default: master
      skip_build_check:
        description: Deploy without waiting for the template build to go green
        type: boolean
        default: false

env:
  DEPLOY_BRANCH: live
  HOSTNAME: streetfight.houseabsolute.co.uk

concurrency:
  group: deploy-archive
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      actions: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve the revision
      env:
        REF: ${{ inputs.ref }}
      run: |
        SHA=$(git rev-parse --verify "origin/$REF^{commit}" 2>/dev/null \
          || git rev-parse --verify "$REF^{commit}")
        echo "SHA=$SHA" >> "$GITHUB_ENV"
        echo "Deploying $REF -> $SHA"

    # A cattle container is replaced wholesale by template filename, so the
    # artifact has to exist before the branch is worth moving: an unbuildable
    # revision on `live` leaves the hypervisor with nothing to fetch and the
    # archive quietly running what it had.
    #
    # The check run may not exist yet, or may still be queued, if this deploy
    # was dispatched hot on the heels of the push that triggered it. Rather
    # than fail on that race, poll for up to ten minutes — a genuine failure
    # (not just "not there yet") still fails fast.
    - name: Check the archive template was built
      if: ${{ !inputs.skip_build_check }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        DEADLINE=$((SECONDS + 600))
        while true; do
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "build_lxc_template_archive / build") | .conclusion' \
            | head -n1)
          if [ "$CONCLUSION" = "success" ]; then
            echo "build_lxc_template_archive for $SHA succeeded."
            break
          fi
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "null" ]; then
            echo "::error::build_lxc_template_archive for $SHA is '$CONCLUSION', not success."
            exit 1
          fi
          if [ "$SECONDS" -ge "$DEADLINE" ]; then
            echo "::error::build_lxc_template_archive for $SHA still '${CONCLUSION:-missing}' after 10 minutes." \
              "Wait for it, or re-run with skip_build_check."
            exit 1
          fi
          echo "build_lxc_template_archive for $SHA is '${CONCLUSION:-missing}', waiting..."
          sleep 20
        done

    # Force, because rolling back to an earlier commit is the emergency path
    # and it is not a fast-forward.
    - name: Move the deploy ref
      run: |
        git push --force origin "$SHA:refs/heads/$DEPLOY_BRANCH"
        echo "### Archive → [\`${SHA:0:8}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$SHA)" >> "$GITHUB_STEP_SUMMARY"

    # ⚠️ Load-bearing, for the reason spelled out in deploy-staging.yml: the
    # hypervisor picks the newest release *by publication time*, and
    # build-template.yml names its release `template-<date>-<sha7>` — so a
    # revision already built today gets its asset re-uploaded to a release
    # whose timestamp never moves, and nothing at home notices.
    #
    # ⚠️ Both templates share that tag, so if the same revision has already
    # been put on staging today this deletes staging's asset too. Harmless —
    # staging resolves the previous release and carries on — but it explains
    # an unexpected staging redeploy.
    - name: Drop a same-day release for this revision
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="template-$(date -u +%Y%m%d)-${SHA:0:7}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists for this revision: deleting it, so the" \
            "build below publishes one the deployer sees as new."
          gh release delete "$TAG" --yes
        else
          echo "No existing release $TAG; the build below will publish it."
        fi

    # `git push` above authenticates as the default GITHUB_TOKEN (via
    # actions/checkout's persisted credentials), and GitHub does not fire
    # `push`-triggered workflows for GITHUB_TOKEN pushes — anti-recursion
    # protection — so build_images.yml, which publishes the template release
    # cattle-deploy.timer polls for, never runs off the back of it. Dispatch
    # it explicitly: a workflow_dispatch by GITHUB_TOKEN is exempt.
    - name: Trigger the archive build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run build_images.yml --ref "$DEPLOY_BRANCH"

    # Unlike staging, this one is on the public internet, so a GitHub runner
    # can see it. The template still has to build, publish, be fetched and
    # replace the container, so the window is generous.
    - name: Wait for the archive to report the new revision
      run: |
        for _ in $(seq 1 90); do
          REPORTED=$(curl -fsS --max-time 20 "https://$HOSTNAME/api/get_version" \
            | sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p') || REPORTED=""
          if [ -n "$REPORTED" ] && [ "${SHA#"$REPORTED"}" != "$SHA" ]; then
            echo "Live: $REPORTED"
            echo "Live and serving \`$REPORTED\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "still serving '${REPORTED:-?}', waiting..."
          sleep 20
        done
        echo "::error::$HOSTNAME never reported $SHA." \
          "The ref has moved and the build was dispatched, so it may still land:" \
          "check the *Build images* run on \`live\`, then" \
          "'journalctl -u cattle-deploy -f' on homeserver."
        exit 1
