name: Deploy to staging

# The staging counterpart to deploy.yml, for the LXC container on the home lab
# (https://streetfight-staging.i.houseabsolute.co.uk). Same shape, same manual
# gate: this workflow advances `refs/heads/staging`, and everything downstream
# is pull-based, so nothing here holds a credential for anything at home.
#
# What the push sets off:
#
#   staging moves -> build_images.yml runs on `staging` and publishes
#   streetfight-staging-lxc-proxmox-<label>-<sha>.tar.xz as a release asset
#   -> cattle-deploy.timer on homeserver sees it, verifies the sha256, and
#      replaces CT 101. Fifteen to twenty-five minutes end to end.
#
# ⚠️ Unlike deploy.yml there is no "wait until it is live" step, and there
# cannot be: the staging host answers on 10.0.1.34, which a GitHub runner has
# no route to. The job ends at the push. See docs/deployment_staging.md for
# where to look instead.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to put on staging
        required: true
        default: master
      skip_build_check:
        description: Deploy even if the LXC template has not been built for this revision
        type: boolean
        default: false

env:
  DEPLOY_BRANCH: staging
  HOSTNAME: streetfight-staging.i.houseabsolute.co.uk

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve the revision
      env:
        REF: ${{ inputs.ref }}
      run: |
        SHA=$(git rev-parse --verify "origin/$REF^{commit}" 2>/dev/null \
          || git rev-parse --verify "$REF^{commit}")
        echo "SHA=$SHA" >> "$GITHUB_ENV"
        echo "Deploying $REF -> $SHA"

    # A revision whose template does not build publishes no release asset, so
    # the deploy would look like it worked and then simply never happen. Cheap
    # to check here, because build_images.yml builds the template on every
    # branch; only the release is gated on `staging`.
    - name: Check the LXC template was built
      if: ${{ !inputs.skip_build_check }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
          --jq '.check_runs[] | select(.name == "build_lxc_template / build") | .conclusion' \
          | head -n1)
        if [ "$CONCLUSION" != "success" ]; then
          echo "::error::build_lxc_template for $SHA is '${CONCLUSION:-missing}', not success." \
            "Wait for it, or re-run with skip_build_check if you know better."
          exit 1
        fi

    # Force, because rolling back to an earlier commit is not a fast-forward.
    # ⚠️ On staging a rollback needs one more step than on the droplet: the
    # deployer picks the newest release by publication time, and a same-day
    # re-run only re-uploads the asset to the existing release. See
    # docs/deployment_staging.md.
    - name: Move the deploy ref
      run: |
        git push --force origin "$SHA:refs/heads/$DEPLOY_BRANCH"
        {
          echo "### Staging: [\`${SHA:0:8}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$SHA)"
          echo
          echo "Watch it land:"
          echo
          echo "- the *Build images* run on \`staging\`, which publishes the template release"
          echo "- \`journalctl -u cattle-deploy -f\` on homeserver, which picks it up"
          echo "- \`curl -s https://${HOSTNAME}/api/get_version\` from the LAN or the tailnet"
        } >> "$GITHUB_STEP_SUMMARY"
