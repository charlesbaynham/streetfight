name: Build images

on:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

# Every job here builds with Nix. Results are cached in the public streetfight
# Cachix cache (https://app.cachix.org/cache/streetfight): pulls are
# anonymous, pushes use CACHIX_AUTH_TOKEN when available. The flake's
# nixConfig declares the same substituter so local builds also hit the cache
# without extra setup.

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v2
    - name: Install Nix
      uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: streetfight
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Compute Docker-safe branch tag
      run: echo "BRANCH_TAG=$(echo "$GITHUB_REF" | sed 's|refs/heads/||' | sed 's|/|-|g')" >> "$GITHUB_ENV"
    - name: Build frontend docker image
      run: |
        nix build .#dockerFrontend
        export IMG_ID=$(docker load -i result | sed -nr 's/^Loaded image: (.*)$/\1/p' | xargs -I{} docker image ls "{}" --format="{{.ID}}")
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$GITHUB_SHA
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$BRANCH_TAG
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:latest
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push to registry
      run: |
        echo "Pushing Docker image to GitHub Container Registry"
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$GITHUB_SHA
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$BRANCH_TAG
    - name: Push as "latest"
      if: github.ref == 'refs/heads/master'
      run: |
        echo "Pushing Docker image to GitHub Container Registry"
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:latest

  build_backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v2
    - name: Install Nix
      uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: streetfight
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Compute Docker-safe branch tag
      run: echo "BRANCH_TAG=$(echo "$GITHUB_REF" | sed 's|refs/heads/||' | sed 's|/|-|g')" >> "$GITHUB_ENV"
    - name: Build backend docker image
      run: |
        nix build .#dockerBackend
        export IMG_ID=$(docker load -i result | sed -nr 's/^Loaded image: (.*)$/\1/p' | xargs -I{} docker image ls "{}" --format="{{.ID}}")
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$GITHUB_SHA
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$BRANCH_TAG
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-backend:latest

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push to registry
      run: |
        echo "Pushing Docker image to GitHub Container Registry"

        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$GITHUB_SHA
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$BRANCH_TAG
    - name: Push as "latest"
      if: github.ref == 'refs/heads/master'
      run: |
        echo "Pushing Docker image to GitHub Container Registry"
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-backend:latest

  # Push the droplet's whole system closure to Cachix so the droplet
  # substitutes it rather than building it: nix/auto-deploy.nix runs
  # `nixos-rebuild switch` on a 1-vCPU box, where only evaluation is
  # affordable. It runs on branches too, deliberately: it is the only check
  # that the cloud configuration still evaluates, and evaluation is exactly
  # what broke unnoticed before auto-deploy existed.
  build_cloud_system:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v2
    - name: Install Nix
      uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: streetfight
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Build the cloud system closure
      run: nix build .#nixosConfigurations.streetfight-cloud.config.system.build.toplevel
    # Builds the installer app too, which is what runs ShellCheck over it.
    - name: Build the installer
      run: nix build .#installCloud

  # Build the Proxmox LXC rootfs template and publish it as a release asset.
  # Deployment is pull-based — CI has no route to a hypervisor behind domestic
  # NAT — so the hypervisor fetches the asset itself. The pattern, and the
  # contract this repo has to honour in exchange, live in nix-proxmox-cattle.
  #
  # The template is the **staging** deployment on the home lab, so it is
  # released from `staging` rather than master — the counterpart to the
  # droplet's `live` ref. Every other branch, master included, still builds it:
  # that build is the check deploy-staging.yml gates on, and it publishes
  # nothing, so merging to master deploys nowhere.
  build_lxc_template:
    permissions:
      contents: write
    uses: charlesbaynham/nix-proxmox-cattle/.github/workflows/build-template.yml@v1
    with:
      release_branch: staging
    secrets: inherit
