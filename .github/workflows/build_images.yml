name: Build images

on:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v2
    - name: Install Nix
      uses: cachix/install-nix-action@v31
    - name: Compute Docker-safe branch tag
      run: echo "BRANCH_TAG=$(echo "$GITHUB_REF" | sed 's|refs/heads/||' | sed 's|/|-|g')" >> "$GITHUB_ENV"
    - name: Build frontend docker image
      run: |
        nix build .#dockerFrontend
        export IMG_ID=$(docker load -i result | sed -nr 's/^Loaded image: (.*)$/\1/p' | xargs -I{} docker image ls "{}" --format="{{.ID}}")
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$GITHUB_SHA
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$BRANCH_TAG
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:latest
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push to registry
      run: |
        echo "Pushing Docker image to GitHub Container Registry"
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$GITHUB_SHA
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$BRANCH_TAG
    - name: Push as "latest"
      if: github.ref == 'refs/heads/master'
      run: |
        echo "Pushing Docker image to GitHub Container Registry"
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:latest

  build_backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v2
    - name: Install Nix
      uses: cachix/install-nix-action@v31
    - name: Compute Docker-safe branch tag
      run: echo "BRANCH_TAG=$(echo "$GITHUB_REF" | sed 's|refs/heads/||' | sed 's|/|-|g')" >> "$GITHUB_ENV"
    - name: Build backend docker image
      run: |
        nix build .#dockerBackend
        export IMG_ID=$(docker load -i result | sed -nr 's/^Loaded image: (.*)$/\1/p' | xargs -I{} docker image ls "{}" --format="{{.ID}}")
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$GITHUB_SHA
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$BRANCH_TAG
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-backend:latest

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push to registry
      run: |
        echo "Pushing Docker image to GitHub Container Registry"

        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$GITHUB_SHA
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$BRANCH_TAG
    - name: Push as "latest"
      if: github.ref == 'refs/heads/master'
      run: |
        echo "Pushing Docker image to GitHub Container Registry"
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-backend:latest

  # Build the Proxmox LXC rootfs template. Deployment is pull-based: CI has no
  # route to the hypervisor (it sits on a home LAN behind NAT), so the template
  # is published as a release asset and fetched from the LAN side, rather than
  # CI holding a Proxmox credential and pushing.
  build_lxc_template:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish the template as a release asset
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: cachix/install-nix-action@v31
    # Without a binary cache CI rebuilds the whole closure on every run, which is
    # what quietly kills the update cadence. This one backs onto the GitHub
    # Actions cache, so there is no service to pay for, no secret to configure,
    # and pull requests get the cache too. install-nix-action puts the runner in
    # trusted-users by default, which is what lets the daemon register itself as
    # a substituter.
    - name: Set up the Nix binary cache
      uses: DeterminateSystems/magic-nix-cache-action@v14
      with:
        # Not on FlakeHub; without this it tries to authenticate against it.
        use-flakehub: false
    - name: Build Proxmox LXC template
      run: |
        nix build .#proxmoxLxcTemplate --print-build-logs
        # The tarball is named after the NixOS label, which carries the nixpkgs
        # revision. Add the commit SHA so app-only changes produce a distinct
        # filename too: a new filename is what forces the container to be
        # replaced, and keeping generations distinct is what makes rollback
        # possible.
        BUILT=$(echo result/tarball/*.tar.xz)
        TEMPLATE_NAME="$(basename "$BUILT" .tar.xz)-${GITHUB_SHA::7}.tar.xz"
        mkdir -p dist
        cp "$BUILT" "dist/$TEMPLATE_NAME"
        echo "TEMPLATE_NAME=$TEMPLATE_NAME" >> "$GITHUB_ENV"
        ls -lh dist/
    - name: Upload template as a workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: proxmox-lxc-template
        path: dist/${{ env.TEMPLATE_NAME }}
        retention-days: 14
    - name: Publish template as a release asset
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="template-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
        # A release per master build, so several generations stay downloadable:
        # rolling back means redeploying a previous template, which needs the
        # old artifact to still exist.
        gh release create "$TAG" \
          --title "Proxmox LXC template $TAG" \
          --notes "Street Fight Proxmox LXC rootfs template built from ${GITHUB_SHA}." \
          --target "$GITHUB_SHA" \
          || echo "Release $TAG already exists, uploading asset to it"
        gh release upload "$TAG" "dist/$TEMPLATE_NAME" --clobber
