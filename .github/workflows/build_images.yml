name: Build images

on:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

# Every job here builds with Nix, and each one follows "Install Nix" with the
# Magic Nix Cache. It stores build results in the GitHub Actions cache, so there
# is no account, no secret and no third-party service, and pull requests get the
# cache too. install-nix-action adds the runner to trusted-users by default,
# which is what lets the caching daemon register itself as a substituter.
#
# Paths already available from the upstream cache (cache.nixos.org) are
# deliberately not re-cached, so what this actually saves is the project's own
# closure: the Python environment, the frontend build and the LXC tarball.

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v2
    - name: Install Nix
      uses: cachix/install-nix-action@v31
    - name: Set up the Nix binary cache
      uses: DeterminateSystems/magic-nix-cache-action@v14
      with:
        # Not on FlakeHub; without this it tries to authenticate against it.
        use-flakehub: false
    - name: Compute Docker-safe branch tag
      run: echo "BRANCH_TAG=$(echo "$GITHUB_REF" | sed 's|refs/heads/||' | sed 's|/|-|g')" >> "$GITHUB_ENV"
    - name: Build frontend docker image
      run: |
        nix build .#dockerFrontend
        export IMG_ID=$(docker load -i result | sed -nr 's/^Loaded image: (.*)$/\1/p' | xargs -I{} docker image ls "{}" --format="{{.ID}}")
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$GITHUB_SHA
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$BRANCH_TAG
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:latest
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push to registry
      run: |
        echo "Pushing Docker image to GitHub Container Registry"
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$GITHUB_SHA
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:$BRANCH_TAG
    - name: Push as "latest"
      if: github.ref == 'refs/heads/master'
      run: |
        echo "Pushing Docker image to GitHub Container Registry"
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-frontend:latest

  build_backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v2
    - name: Install Nix
      uses: cachix/install-nix-action@v31
    - name: Set up the Nix binary cache
      uses: DeterminateSystems/magic-nix-cache-action@v14
      with:
        # Not on FlakeHub; without this it tries to authenticate against it.
        use-flakehub: false
    - name: Compute Docker-safe branch tag
      run: echo "BRANCH_TAG=$(echo "$GITHUB_REF" | sed 's|refs/heads/||' | sed 's|/|-|g')" >> "$GITHUB_ENV"
    - name: Build backend docker image
      run: |
        nix build .#dockerBackend
        export IMG_ID=$(docker load -i result | sed -nr 's/^Loaded image: (.*)$/\1/p' | xargs -I{} docker image ls "{}" --format="{{.ID}}")
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$GITHUB_SHA
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$BRANCH_TAG
        docker tag $IMG_ID $REGISTRY/${IMAGE_NAME_PREFIX}-backend:latest

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push to registry
      run: |
        echo "Pushing Docker image to GitHub Container Registry"

        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$GITHUB_SHA
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-backend:$BRANCH_TAG
    - name: Push as "latest"
      if: github.ref == 'refs/heads/master'
      run: |
        echo "Pushing Docker image to GitHub Container Registry"
        docker push $REGISTRY/${IMAGE_NAME_PREFIX}-backend:latest

  # Build the Proxmox LXC rootfs template and publish it as a release asset.
  # Deployment is pull-based — CI has no route to a hypervisor behind domestic
  # NAT — so the hypervisor fetches the asset itself. The pattern, and the
  # contract this repo has to honour in exchange, live in nix-proxmox-cattle.
  build_lxc_template:
    permissions:
      contents: write
    uses: charlesbaynham/nix-proxmox-cattle/.github/workflows/build-template.yml@v1
