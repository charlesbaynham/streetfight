name: Test backend

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install Nix
      uses: cachix/install-nix-action@v31
    - uses: actions/setup-node@v3
      with:
        cache: npm
    # The `ci` shell is the dev shell minus TeX, which is only needed by the
    # map/PDF generation scripts — not by the tests.
    - name: Install dependencies
      run: nix develop .#ci -c npm install
    - name: Test with pytest
      run: |
        cp .env.dev .env
        nix develop .#ci -c pytest
